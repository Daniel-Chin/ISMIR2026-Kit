[project]
name = "ismir-guide"
version = "0.1.0"
description = "ISMIR 2026 conference assistant Slack bot (ingress + worker)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
    "slack-bolt>=1.20",
    "slack-sdk>=3.31",
    "google-cloud-tasks>=2.16",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.18",
    "anthropic>=0.40",
    "numpy>=2.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
